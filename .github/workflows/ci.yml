name: CI
on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: villages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build-tmp/playwright
  TZ: UTC
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: runner.os == 'Linux' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: villages-linux
          path: |
            artifacts/villages-*.zip
            .build-tmp/package-build.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  validate-windows:
    name: validate-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: runner.os == 'Linux' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: villages-windows
          path: |
            artifacts/villages-*.zip
            .build-tmp/package-build.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  package-parity:
    name: package-parity
    needs: [validate, validate-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v4
        with:
          pattern: villages-*
          path: .build-tmp/platforms
      - run: node scripts/package-parity.mjs .build-tmp/platforms/villages-linux .build-tmp/platforms/villages-windows
