name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  parallel-work:
    name: parallel-work
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request and staging base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check branch freshness and overlapping Villages PR files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/check-parallel-work.mjs

  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting and lint checks
        run: npm run check

      - name: Verify Progress Engine and automatic Project evidence
        run: |
          npx tsx tests/villages-progress-engine.regression.ts
          npx tsx tests/villages-progress-projects.regression.ts
          npx tsx tests/villages-project-interpretation.regression.ts
