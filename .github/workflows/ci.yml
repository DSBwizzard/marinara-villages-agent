name: CI
on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: villages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  TZ: UTC
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check && npm run verify:build && npm run verify:package && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: villages-linux
          path: |
            artifacts/villages-*.zip
            .build-tmp/package-build.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  validate-windows:
    name: validate-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check && npm run verify:build && npm run verify:package && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: villages-windows
          path: |
            artifacts/villages-*.zip
            .build-tmp/package-build.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  browser:
    name: browser-ubuntu-24.04-${{ matrix.part }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --init --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser -- --shard=${{ matrix.part }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-browser-Linux-${{ matrix.part }}
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  browser-windows:
    name: browser-windows-2025-${{ matrix.part }}
    runs-on: windows-2025
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build-tmp/playwright
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:browser -- --shard=${{ matrix.part }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-browser-${{ runner.os }}-${{ matrix.part }}
          path: .build-tmp/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  package-parity:
    name: package-parity
    needs: [validate, validate-windows, browser, browser-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs = JSON.parse(process.env.VALIDATION_JOBS); if (Object.values(needs).some(job => job.result !== "success")) process.exit(1);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v4
        with:
          pattern: villages-*
          path: .build-tmp/platforms
      - run: node scripts/package-parity.mjs .build-tmp/platforms/villages-linux .build-tmp/platforms/villages-windows
