name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  parallel-work:
    name: parallel-work
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request and staging base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check branch freshness and overlapping Villages PR files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/check-parallel-work.mjs

  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting and lint checks
        run: npm run check

      - name: Verify Sprite Manager
        run: |
          npx tsx tests/villages-sprite-manager.regression.ts
          npx tsx tests/villages-resident-sprites.regression.ts

      - name: Verify scene staging and reading pages
        run: |
          npx tsx tests/villages-scene-staging.regression.ts
          npx tsx tests/villages-reading-pages.regression.ts

      - name: Verify complete character identity and writing context
        run: |
          npx tsx tests/villages-character-writing.regression.ts
          npx tsx tests/villages-scene-text.regression.ts
          npx tsx tests/villages-dialogue-context.regression.ts

      - name: Verify finite wishes and routine isolation
        run: |
          npx tsx tests/villages-live-wishes.regression.ts
          npx tsx tests/villages-wish-lifecycle.regression.ts
          npx tsx tests/villages-wish-interpretation.regression.ts
          npx tsx tests/villages-compact-founding.regression.ts
          npx tsx tests/villages-owned-agendas.regression.ts
          npx tsx tests/villages-generation-recovery.regression.ts
          npx tsx tests/villages-schedule-remap.regression.ts

      - name: Verify Progress Engine and automatic Project evidence
        run: |
          npx tsx tests/villages-live-memory.regression.ts
          npx tsx tests/villages-exchange-processing.regression.ts
          npx tsx tests/villages-pipeline-efficiency.regression.ts
          npx tsx tests/villages-progress-engine.regression.ts
          npx tsx tests/villages-progress-projects.regression.ts
          npx tsx tests/villages-project-interpretation.regression.ts
          npx tsx tests/villages-project-checks.regression.ts
          npx tsx tests/villages-zones.regression.ts
          npx tsx tests/villages-scene-actions.regression.ts
          npx tsx tests/villages-contact.regression.ts
          npx tsx tests/villages-runtime-debug.regression.ts
          npx tsx tests/villages-usage-meter.regression.ts
          npx tsx tests/villages-linkapi-pricing.regression.ts
          npx tsx tests/villages-usage-preview.regression.ts
          npx tsx tests/villages-venue-model.regression.ts
          npx tsx tests/villages-venue-session.regression.ts
          npx tsx tests/villages-relationships.regression.ts
          npx tsx tests/villages-venue-coordinator.regression.ts
          npx tsx tests/villages-interpretation.regression.ts
          npx tsx tests/villages-interpretation-evidence.regression.ts
          npx tsx tests/villages-interpretation-routing.regression.ts
          npx tsx tests/villages-room-events.regression.ts
          npx tsx tests/villages-wish-batch.regression.ts
          npx tsx tests/villages-check-cost-replay.regression.ts
          npx tsx tests/villages-background-work.regression.ts
          npx tsx tests/villages-automatic-refresh.regression.ts
          npx tsx tests/villages-agenda-movement.regression.ts
          npx tsx tests/villages-scene-staging.regression.ts

      - name: Verify founding, scenery and private spaces
        run: |
          npx tsx tests/villages-client-scope.regression.ts
          npx tsx tests/villages-founding-flow.regression.ts
          npx tsx tests/villages-setting-grounding.regression.ts
          npx tsx tests/villages-player-role.regression.ts
          npx tsx tests/villages-private-spaces.regression.ts
          npx tsx tests/villages-optional-layouts.regression.ts
          npx tsx tests/villages-lorebooks.regression.ts
          npx tsx tests/villages-town-map-image.regression.ts

      - name: Verify desktop and mobile founding
        run: |
          npx playwright install --with-deps chromium
          node tests/villages-founding-layout.e2e.mjs
          node tests/villages-venue-layout.e2e.mjs
          npx tsx tests/villages-mobile-map.regression.ts
          node tests/villages-mobile-exploration.e2e.mjs
          node tests/villages-player-role.e2e.mjs
          node tests/villages-room-notices.e2e.mjs
          node tests/villages-contact.e2e.mjs
          node tests/villages-scene-actions.e2e.mjs
          node --import tsx tests/villages-venue-coordination.e2e.mjs
          node tests/villages-runtime-debug.e2e.mjs
          node tests/villages-usage-meter.e2e.mjs
          node tests/villages-usage-preview.e2e.mjs
          node tests/villages-owned-agendas.e2e.mjs
          node tests/villages-sprite-manager.e2e.mjs
          node tests/villages-scene-staging.e2e.mjs
          node tests/villages-scene-controls.e2e.mjs
          node tests/villages-reading-pages.e2e.mjs

      - name: Verify greeting recovery without paid retries
        run: node tests/villages-greeting-recovery.e2e.mjs

      - name: Verify Scene sending and failure recovery
        run: |
          npx tsx tests/villages-venue-send.regression.ts
          npx tsx tests/villages-remote-access.regression.ts
          npx tsx tests/villages-settings-drift.regression.ts
          node tests/villages-scene-send-recovery.e2e.mjs
