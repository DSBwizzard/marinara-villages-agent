name: Browser runtime cache

on:
  push:
    branches: [staging]
    paths:
      - package-lock.json
      - .github/workflows/browser-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    if: github.ref == 'refs/heads/staging'
    runs-on: windows-2025
    timeout-minutes: 15
    concurrency:
      group: villages-browser-runtime-${{ github.ref }}-windows-2025
      cancel-in-progress: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build-tmp/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Restore browser runtime
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install browser runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Save staging browser runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
